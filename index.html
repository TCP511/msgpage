<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Secret Message</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
            color: #212529;
        }

        .brand {
            background: #ffffff;
            border-bottom: 1px solid #dee2e6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .brand-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .brand h1 {
            margin: 0 0 6px;
            font-size: 30px;
            font-weight: 700;
            color: #212529;
        }

        .brand p {
            margin: 0;
            font-size: 15px;
            color: #6c757d;
        }

        .message-card {
            max-width: 650px;
            margin: 60px auto;
        }

        @media (max-width: 576px) {
            .brand h1 {
                font-size: 25px;
            }

            .brand p {
                font-size: 14px;
            }

            .message-card {
                margin-top: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="brand">
        <div class="brand-inner">
            <h1>Secret Message</h1>
            <p>
                Share private messages with employees and customers
                over a secure channel.
            </p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <div class="message-card">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <h2 class="h4 mb-4">
                        Send a Secret Message
                    </h2>

                    <form>

                        <div class="mb-3">
                            <label for="recipient" class="form-label">
                                Recipient
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="recipient"
                                name="recipient"
                                placeholder="Enter recipient"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">
                                Message
                            </label>

                            <textarea
                                class="form-control"
                                id="message"
                                name="message"
                                rows="6"
                                placeholder="Write your private message..."
                            ></textarea>
                        </div>

                        <div class="d-grid">
                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Send Secure Message
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"
    ></script>

</body>
</html>
