<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Secret Message | Coming Soon</title>

    <style>
        :root {
            --primary: #a8243b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--primary);
        }

        .coming-soon {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 650px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 55px;
            color: var(--primary);
        }

        .coming {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 18px;
            color: var(--primary);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: -1.5px;
            color: var(--primary);
        }

        p {
            margin: 0 auto;
            max-width: 520px;
            font-size: 16px;
            line-height: 1.7;
            color: var(--primary);
        }

        @media (max-width: 576px) {

            .brand {
                font-size: 24px;
                margin-bottom: 40px;
            }

            h1 {
                font-size: 38px;
                letter-spacing: -1px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="coming-soon">

        <div class="content">

            <div class="brand">
                Secret Message
            </div>

            <div class="coming">
                COMING SOON
            </div>

            <h1>
                Secure Sharing,<br>
            </h1>


        </div>

    </main>

</body>
</html>
